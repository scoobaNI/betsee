                  "approval_threshold_cents",
                  "budget",
                  "agent_ids",
                  "peer_ids",
                ],
            },
          "CreateSession":
            {
              "type": "object",
              "properties":
                {
                  "agent_id": { "type": "string" },
                  "use_case_id": { "type": "string" },
                  "delegated":
                    { "type": "array", "items": { "type": "string" } },
                  "tier_ceiling": { "$ref": "#/components/schemas/Tier" },
                  "budget_cents": { "type": "integer", "minimum": 1 },
                },
              "required":
                ["agent_id", "use_case_id", "delegated", "tier_ceiling"],
            },
          "ActionRequest":
            {
              "type": "object",
              "properties":
                {
                  "session_id": { "type": "string" },
                  "capability": { "type": "string" },
                  "resource": { "$ref": "#/components/schemas/Resource" },
                  "parameters":
                    { "type": "object", "additionalProperties": true },
                },
              "required":
                ["session_id", "capability", "resource", "parameters"],
              "description": "Resource type/id must exist in the Gateway catalog. Client tier is descriptive; Gateway uses stored tier. Parameters contain amount_cents, command, content, requested_capability or tool arguments. Agent cannot supply policy facts, budget cost, approval, analysis or observed descriptor hashes.",
            },
          "Approval":
            {
              "type": "object",
              "properties":
                {
                  "id": { "type": "string" },
                  "trace_id": { "type": "string" },
                  "state": { "$ref": "#/components/schemas/ApprovalState" },
                  "action": { "$ref": "#/components/schemas/ActionSummary" },
                  "requested_reasons":
                    {
                      "type": "array",
                      "items":
                        { "$ref": "#/components/schemas/DecisionReason" },
                      "description": "Original reasons requiring human review, retained after approval or rejection. action.reasons describes the current execution decision. Historical approvals recover requested_reasons from their first append-only pending audit record when available.",
                    },
                  "parameters":
                    { "type": "object", "additionalProperties": true },
                  "provenance":
                    {
                      "type": "object",
                      "additionalProperties": true,
                      "properties":
                        {
                          "fields":
                            {
                              "type": "object",
                              "additionalProperties":
                                {
                                  "type": "string",
                                  "enum": ["agent", "gateway"],
                                },
                            },
                        },
                    },
                  "action_hash": { "type": "string" },
                  "requires_step_up": { "type": "boolean" },
                  "approver_acr":
                    {
                      "type": "string",
                      "description": "ACR from the verified human token that resolved this approval. Historical records expose it only when a resolved approval or step-up span proves the same approver identity; requires_step_up alone is not proof.",
                    },
                  "created_at": { "type": "string", "format": "date-time" },
                  "decided_at":
                    {
                      "anyOf":
                        [
                          { "type": "string", "format": "date-time" },
                          { "type": "null" },
                        ],
                    },
                  "approver":
                    {
                      "anyOf":
                        [
                          { "$ref": "#/components/schemas/Human" },
                          { "type": "null" },
                        ],
                    },
                  "gateway_facts":
                    {
                      "type": "object",
                      "properties":
                        {
                          "resource":
                            { "$ref": "#/components/schemas/Resource" },
                          "amount":
                            {
                              "type": "object",
                              "properties":
                                {
                                  "cents": { "type": "integer", "minimum": 1 },
                                  "currency":
                                    { "type": "string", "enum": ["EUR"] },
                                },
                              "required": ["cents", "currency"],
                            },
                          "amount_cents": { "type": "integer", "minimum": 1 },
                          "currency": { "type": "string", "enum": ["EUR"] },
                        },
                    },
                },
              "required":
                [
                  "id",
                  "trace_id",
                  "state",
                  "action",
                  "parameters",
                  "provenance",
                  "action_hash",
                  "requires_step_up",
                  "created_at",
                  "decided_at",
                  "approver",
                ],
            },
          "ApprovalResult":
            {
              "type": "object",
              "properties":
                {
                  "status":
                    {
                      "type": "string",
                      "enum": ["approved", "rejected", "step_up_required"],
                    },
                  "trace_id": { "type": "string" },
                  "approval_id": { "type": "string" },
                  "acr_values":
                    { "anyOf": [{ "type": "string" }, { "type": "null" }] },
                  "action": { "$ref": "#/components/schemas/ActionSummary" },
                },
              "required":
                ["status", "trace_id", "approval_id", "acr_values", "action"],
            },
          "ApprovalResponse":
            {
              "type": "object",
              "properties": { "reason": { "type": "string" } },
              "required": ["reason"],
            },
