                      "content":
                        {
                          "application/json":
                            {
                              "schema":
                                { "$ref": "#/components/schemas/Error" },
                            },
                        },
                    },
                  "404":
                    {
                      "description": "Unknown resource",
                      "content":
                        {
                          "application/json":
                            {
                              "schema":
                                { "$ref": "#/components/schemas/Error" },
                            },
                        },
                    },
                  "409":
                    {
                      "description": "State conflict",
                      "content":
                        {
                          "application/json":
                            {
                              "schema":
                                { "$ref": "#/components/schemas/Error" },
                            },
                        },
                    },
                  "503":
                    {
                      "description": "Dependency unavailable",
                      "content":
                        {
                          "application/json":
                            {
                              "schema":
                                { "$ref": "#/components/schemas/Error" },
                            },
                        },
                    },
                },
              "security": [],
            },
        },
    },
  "components":
    {
      "securitySchemes":
        {
          "bearerAuth":
            { "type": "http", "scheme": "bearer", "bearerFormat": "JWT" },
