  "openapi": "3.1.0",
  "info":
    {
      "title": "Betsee Gateway",
      "version": "0.2.0",
      "description": "Contract v0.2. D11 uses nullable timing for Cedar-derived stages; D12 adds structured decision reasons. Lists use {items:[...]}; timestamps are UTC RFC3339. Humans and agents authenticate with distinct Keycloak tokens. Every route including SSE accepts Authorization Bearer only (D9). Agent writes require Bearer and bind session_id to authenticated agent. Approval re-evaluates exact persisted parameters and all controls; step_up_required means authenticate with acr_values=2 then retry approval. No client-provided policy facts are trusted.",
    },
  "servers": [{ "url": "http://api.betsee.localhost" }, { "url": "/" }],
  "security": [{ "bearerAuth": [] }],
