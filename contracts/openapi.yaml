                  "parameters":
                    { "type": "object", "additionalProperties": true },
                },
              "required":
                ["control_id", "target_type", "target_id", "parameters"],
            },
          "Control":
            {
              "type": "object",
              "properties":
                {
                  "id": { "type": "string" },
                  "name": { "type": "string" },
                  "description": { "type": "string" },
                  "primitive": { "type": "string" },
                  "asi": { "type": "array", "items": { "type": "string" } },
                  "attachment_points":
                    { "type": "array", "items": { "type": "string" } },
                  "enforcement": { "type": "string" },
                  "policy_ids":
                    { "type": "array", "items": { "type": "string" } },
                  "attachments":
                    {
                      "type": "array",
                      "items": { "$ref": "#/components/schemas/Attachment" },
                    },
                },
              "required":
                [
                  "id",
                  "name",
                  "description",
                  "primitive",
                  "asi",
                  "attachment_points",
                  "enforcement",
                  "policy_ids",
                  "attachments",
                ],
            },
          "Policy":
            {
              "type": "object",
              "properties":
                {
                  "id": { "type": "string" },
                  "name": { "type": "string" },
                  "cedar": { "type": "string" },
                  "control_ids":
                    { "type": "array", "items": { "type": "string" } },
                },
              "required": ["id", "name", "cedar", "control_ids"],
            },
          "Connector":
            {
              "type": "object",
              "properties":
                {
                  "id": { "type": "string" },
                  "name": { "type": "string" },
                  "kind":
                    {
                      "type": "string",
                      "enum":
                        [
                          "anthropic-direct",
