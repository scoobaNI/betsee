  "components":
    {
      "securitySchemes":
        {
          "bearerAuth":
            { "type": "http", "scheme": "bearer", "bearerFormat": "JWT" },
        },
      "schemas":
        {
          "Decision":
            {
              "type": "string",
              "enum": ["allow", "require_approval", "require_step_up", "deny"],
            },
          "Tier":
            {
              "type": "string",
              "enum": ["public", "internal", "confidential", "restricted"],
            },
          "ApprovalState":
            {
              "type": "string",
              "enum": ["none", "pending", "approved", "rejected", "voided"],
            },
          "Budget":
            {
              "type": "object",
              "properties":
                {
                  "limit": { "type": "integer" },
                  "used": { "type": "integer" },
                  "unit": { "type": "string", "enum": ["cents"] },
                },
              "required": ["limit", "used", "unit"],
            },
          "Human":
            {
              "type": "object",
              "properties":
                {
                  "sub": { "type": "string" },
                  "display_name": { "type": "string" },
                },
              "required": ["sub", "display_name"],
            },
          "AgentRef":
            {
              "type": "object",
              "properties":
                {
                  "id": { "type": "string" },
                  "name": { "type": "string" },
                  "team": { "type": "string" },
                },
              "required": ["id", "name", "team"],
            },
          "UseCaseRef":
            {
              "type": "object",
              "properties":
                { "id": { "type": "string" }, "name": { "type": "string" } },
              "required": ["id", "name"],
            },
          "Resource":
            {
              "type": "object",
              "properties":
                {
                  "type": { "type": "string" },
                  "id": { "type": "string" },
                  "tier": { "$ref": "#/components/schemas/Tier" },
                },
              "required": ["type", "id", "tier"],
            },
          "ToolRef":
            {
              "type": "object",
              "properties":
                {
                  "name": { "type": "string" },
                  "connector": { "type": "string" },
                },
              "required": ["name", "connector"],
            },
          "Analyzer":
            {
              "type": "object",
              "properties":
                {
                  "verdict":
                    {
                      "type": "string",
                      "enum":
                        [
                          "clean",
                          "suspicious",
                          "malicious",
                          "unavailable",
                          "skipped",
                        ],
                    },
                  "rationale": { "type": "string" },
                  "model_label": { "type": "string" },
                  "finding":
                    {
                      "type": "string",
                      "description": "Mock analyzer finding, always displayed together with model_label.",
                    },
                },
              "required": ["verdict", "rationale", "model_label"],
            },
          "ChatInput":
            {
              "type": "object",
              "properties":
                {
                  "session_id": { "type": "string" },
                  "text":
                    { "type": "string", "minLength": 1, "maxLength": 8000 },
                },
              "required": ["session_id", "text"],
              "additionalProperties": false,
            },
          "InputFinding":
            {
              "type": "object",
              "properties":
                {
                  "class":
                    {
                      "type": "string",
                      "enum":
                        [
                          "payment_card",
                          "iban",
                          "pesel",
                          "secret",
                          "resource_above_tier",
                        ],
                    },
                  "label": { "type": "string" },
                  "masked":
                    {
                      "type": "string",
                      "description": "Masked value; the matched text is never returned or stored.",
                    },
                },
              "required": ["class", "label", "masked"],
            },
          "ChatInputResult":
            {
              "allOf":
                [
                  { "$ref": "#/components/schemas/ActionSummary" },
                  {
                    "type": "object",
                    "properties":
                      {
                        "findings":
                          {
                            "type": "array",
                            "items":
                              { "$ref": "#/components/schemas/InputFinding" },
                          },
                      },
                    "required": ["findings"],
                  },
                ],
            },
          "ChatSession":
            {
              "type": "object",
              "properties":
                {
