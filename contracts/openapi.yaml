                            { "type": "number", "minimum": 0, "maximum": 1 },
                        },
                      "required": ["review_at", "block_at"],
                    },
                  "classifier":
                    {
                      "type": "object",
                      "properties":
                        {
                          "id": { "type": "string" },
                          "version": { "type": "string" },
                          "latency_ms": { "type": "number" },
                          "detail":
                            {
                              "type": "object",
                              "properties":
                                {
                                  "score": { "type": "number" },
                                  "variant":
                                    {
                                      "type": "string",
                                      "enum":
                                        [
                                          "plain",
                                          "leetspeak",
                                          "spaced_letters",
                                          "decoded",
                                        ],
                                      "description": "The reading of the text that scored highest.",
                                    },
                                  "terms":
                                    {
                                      "type": "array",
                                      "items":
                                        {
                                          "type": "object",
                                          "properties":
                                            {
                                              "term": { "type": "string" },
                                              "weight": { "type": "number" },
                                            },
                                          "required": ["term", "weight"],
                                        },
                                    },
                                  "intents":
                                    {
                                      "type": "array",
                                      "items": { "type": "string" },
                                    },
                                },
                              "required":
                                ["score", "variant", "terms", "intents"],
                            },
                        },
                      "required": ["id", "version", "latency_ms", "detail"],
                    },
