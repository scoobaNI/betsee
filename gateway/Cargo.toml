[workspace]
members = ["crates/agent-host", "crates/decision", "crates/server"]
resolver = "2"

[workspace.package]
edition = "2024"
license = "MIT"
version = "0.1.0"

[workspace.dependencies]
anyhow = "1"
base64 = "0.22"
async-trait = "0.1"
axum = { version = "0.8", features = ["macros"] }
cedar-policy = "=4.13.0"
chrono = { version = "0.4", features = ["serde"] }
jsonwebtoken = { version = "10", features = ["rust_crypto"] }
regex = "1"
reqwest = { version = "0.13", default-features = false, features = ["json", "rustls"] }
rmcp = { version = "1", features = ["server", "client", "transport-streamable-http-server", "transport-streamable-http-client-reqwest"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"
sha2 = "0.10"
sqlx = { version = "0.8", default-features = false, features = ["runtime-tokio-rustls", "postgres", "json", "chrono", "migrate", "macros"] }
tokio = { version = "1", features = ["full"] }
tokio-stream = "0.1"
tower = { version = "0.5", features = ["util"] }
tower-http = { version = "0.6", features = ["trace", "limit"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
uuid = { version = "1", features = ["v4", "serde"] }
zip = { version = "2", default-features = false, features = ["deflate"] }

[profile.dev]
debug = 0

[profile.release]
debug = 0
