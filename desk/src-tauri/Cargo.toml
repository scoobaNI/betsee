[package]
name = "betsee-desk"
version = "0.1.0"
edition = "2024"
license = "MIT"
description = "Betsee Desk: a governed desktop workspace for Claude Code and Codex"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
betsee-agent-host = { path = "../../gateway/crates/agent-host" }
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-opener = "2"
tokio = { version = "1", features = ["full"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
base64 = "0.22"
uuid = { version = "1", features = ["v4"] }
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

[profile.dev]
debug = 0
